<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試合動画置き場</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171c; --card:#1b1f26; --card-border:rgba(241,237,228,.08);
    --accent:#e8a33d; --accent-soft:rgba(232,163,61,.14);
    --accent2:#4fb3b0; --accent2-soft:rgba(79,179,176,.14);
    --text:#f1ede4; --muted:#8b93a1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Zen Kaku Gothic New',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{ max-width:720px; margin:0 auto; padding:44px 20px 24px; }
  .brand{ display:flex; align-items:center; gap:8px; margin-bottom:18px; }
  .brand-mark{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    background:var(--accent-soft); border:1px solid var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .brand-name{
    font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800;
    font-size:14px; color:var(--accent); letter-spacing:.02em;
  }
  .eyebrow{
    font-family:ui-monospace,'JetBrains Mono',monospace;
    font-size:12px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase;
  }
  h1{
    font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800;
    font-size:clamp(20px,4.5vw,30px); line-height:1.5; margin:10px 0 12px;
  }
  .lede{ color:var(--muted); font-size:15px; margin:0; }
  .quiz-link{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:16px; font-size:13px; font-weight:700;
    color:var(--accent2); text-decoration:none;
    border:1.5px solid var(--accent2); border-radius:999px;
    padding:8px 16px;
  }
  .lightbar{
    height:3px; margin-top:20px; border-radius:3px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity:.7;
  }
  @media (prefers-reduced-motion: no-preference){
    .lightbar{ animation:glow 3.5s ease-in-out infinite; }
    @keyframes glow{ 0%,100%{opacity:.5;} 50%{opacity:.9;} }
  }
  .filters{
    max-width:720px; margin:0 auto; padding:0 20px 12px;
    display:flex; align-items:center; flex-wrap:wrap; gap:10px;
  }
  .filters label{ font-size:13px; color:var(--muted); white-space:nowrap; }
  .team-select{
    flex:1; min-width:200px; max-width:360px;
    background:var(--card); color:var(--text);
    border:1px solid var(--card-border); border-radius:10px;
    padding:9px 12px; font-size:16px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    color-scheme:dark;
  }
  .team-select:focus{ outline:2px solid var(--accent); outline-offset:2px; }
  main{ max-width:720px; margin:0 auto; padding:8px 20px 80px; display:flex; flex-direction:column; gap:12px; }
  .month > summary{
    list-style:none; cursor:pointer; user-select:none;
    display:flex; align-items:baseline; gap:10px;
    padding:12px 4px; border-bottom:1px solid var(--card-border);
  }
  .month > summary::-webkit-details-marker{ display:none; }
  .month > summary::before{
    content:'▸'; display:inline-block; width:14px;
    color:var(--accent); font-size:12px; transition:transform .15s;
  }
  .month[open] > summary::before{ transform:rotate(90deg); }
  .month-title{
    font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:16px;
  }
  .month-count{
    font-family:ui-monospace,'JetBrains Mono',monospace;
    font-size:12px; color:var(--muted);
  }
  .month-body{ display:flex; flex-direction:column; gap:12px; padding-top:12px; }
  .card{
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    padding:20px; display:flex; flex-direction:column; gap:14px;
  }
  .match{ font-weight:700; font-size:17px; word-break:break-word; }
  .match .vs{ color:var(--muted); font-weight:400; margin:0 6px; }
  .meta{
    font-family:ui-monospace,'JetBrains Mono',monospace; font-size:12px;
    color:var(--muted); margin-top:6px; letter-spacing:.02em;
  }
  .halves{ display:flex; flex-direction:column; gap:8px; }
  .half-row{ display:flex; align-items:flex-start; gap:12px; }
  .half-label{
    min-width:36px; flex-shrink:0; line-height:36px;
    font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap;
  }
  .btns{ display:flex; flex-wrap:wrap; gap:8px; min-width:0; }
  .watch{
    width:112px; min-height:36px; padding:8px 6px;
    display:inline-flex; align-items:center; justify-content:center;
    text-decoration:none; font-size:12.5px; font-weight:700; white-space:nowrap;
    background:var(--accent); color:#1a1300; border-radius:999px;
  }
  .watch-alt{
    background:transparent; border:1.5px solid var(--accent); color:var(--accent);
  }
  .watch-empty{ display:block; width:112px; height:36px; visibility:hidden; }
  .state{ color:var(--muted); text-align:center; padding:60px 20px; font-size:14px; }
  footer.site-footer{
    max-width:720px; margin:40px auto 0; padding:24px 20px 48px;
    border-top:1px solid var(--card-border);
  }
  footer.site-footer h2{
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700;
    font-size:13px; color:var(--muted); margin:0 0 10px;
  }
  footer.site-footer p{
    font-size:12px; line-height:1.8; color:var(--muted); margin:0 0 6px;
  }
  @media (max-width:480px){
    header{ padding:36px 16px 20px; }
    .card{ padding:16px; }
    .team-select{ max-width:none; }
    .btns{ display:grid; grid-template-columns:repeat(2, 1fr); flex:1; }
    .watch, .watch-empty{ width:auto; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark">⚽</span>
      <span class="brand-name">ENJOY!Futsal</span>
    </div>
    <div class="eyebrow">試合動画置き場</div>
    <h1>せっかく毎週集まってるんやから、<br>残ってたらええやん</h1>
    <p class="lede">FUN HYOGO LEAGUEの試合動画、ここに集めていきます。</p>
    <a class="quiz-link" href="https://sunfires2002.github.io/futsal-quiz/" target="_blank" rel="noopener">📋 ルールクイズに挑戦する</a>
    <div class="lightbar"></div>
  </header>

  <div class="filters">
    <label for="teamSelect">チームで絞る</label>
    <select class="team-select" id="teamSelect" disabled>
      <option>読み込み中…</option>
    </select>
  </div>
  <main id="list">
    <div class="state">読み込み中…</div>
  </main>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRt2w9dEQyqbL7x0ln0Rb8jRAMh7m9Ywetu2wrXbAVaxca_hxmI1K-jVMPcXuDhHEB9DFolEsOyoefg/pub?output=csv";
const ALL = 'すべて';
const OPEN_MONTHS = 2;

const SLOTS = [
  { key:'url',      label:'通常' },
  { key:'url360',   label:'360°' },
  { key:'urlScore', label:'スコアカメラ' },
  { key:'urlRev',   label:'逆アングル' }
];

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function safeUrl(url){
  try {
    const u = new URL(String(url ?? '').trim(), location.href);
    if(u.protocol === 'http:' || u.protocol === 'https:') return u.href;
  } catch(e) {}
  return '#';
}

function parseCSV(text){
  const rows=[]; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){field+='"'; i++;} else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && text[i+1]==='\n') i++;
        row.push(field); rows.push(row); row=[]; field='';
      } else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function toMatches(rows){
  const body = rows.slice(1);
  return body.map(function(r){
    return {
      team: (r[0] || '').trim(),
      opponent: (r[1] || '').trim(),
      date: (r[2] || '').trim(),
      url: (r[3] || '').trim(),
      half: (r[4] || '').trim(),
      url360: (r[5] || '').trim(),
      urlScore: (r[6] || '').trim(),
      urlRev: (r[7] || '').trim()
    };
  }).filter(function(m){
    return m.team && (m.url || m.url360 || m.urlScore || m.urlRev);
  });
}

function groupMatches(matches){
  const map = new Map();
  matches.forEach(function(m){
    const key = m.team + '__' + m.opponent + '__' + m.date;
    if(!map.has(key)){
      map.set(key, { team:m.team, opponent:m.opponent, date:m.date, halves:new Map() });
    }
    const g = map.get(key);
    const halfName = m.half || '動画';
    if(!g.halves.has(halfName)){
      g.halves.set(halfName, { url:'', url360:'', urlScore:'', urlRev:'' });
    }
    const h = g.halves.get(halfName);
    SLOTS.forEach(function(s){
      if(m[s.key] && !h[s.key]) h[s.key] = m[s.key];
    });
  });
  return [...map.values()];
}

function halfOrder(name){
  if(name === '前半') return 0;
  if(name === '後半') return 1;
  return 2;
}

function slotHtml(slot, h){
  const url = h[slot.key];
  if(!url){
    return '<span class="watch-empty"></span>';
  }
  const cls = (slot.key === 'url') ? 'watch' : 'watch watch-alt';
  return '<a class="' + cls + '" href="' + escapeHtml(safeUrl(url)) + '" target="_blank" rel="noopener">' + slot.label + ' ▶</a>';
}

function buttonsHtml(h){
  let last = -1;
  SLOTS.forEach(function(s, i){ if(h[s.key]) last = i; });
  return SLOTS.slice(0, last + 1).map(function(s){
    return slotHtml(s, h);
  }).join('');
}

function cardHtml(g){
  const names = [...g.halves.keys()].sort(function(a, b){
    return halfOrder(a) - halfOrder(b);
  });
  const rows = names.map(function(name){
    const h = g.halves.get(name);
    return '<div class="half-row">'
      + '<span class="half-label">' + escapeHtml(name) + '</span>'
      + '<div class="btns">' + buttonsHtml(h) + '</div>'
      + '</div>';
  }).join('');
  return '<div class="card">'
    + '<div class="card-head">'
    + '<div class="match">' + escapeHtml(g.team) + '<span class="vs">vs</span>' + (escapeHtml(g.opponent) || '相手未記入') + '</div>'
    + '<div class="meta">' + (escapeHtml(g.date) || '日付未記入') + '</div>'
    + '</div>'
    + '<div class="halves">' + rows + '</div>'
    + '</div>';
}

function parseDate(str){
  const m = /^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/.exec(String(str || '').trim());
  if(!m) return null;
  return { y:Number(m[1]), m:Number(m[2]), d:Number(m[3]) };
}

function dateNum(str){
  const p = parseDate(str);
  return p ? (p.y * 10000 + p.m * 100 + p.d) : 0;
}

function monthKey(str){
  const p = parseDate(str);
  return p ? (p.y * 100 + p.m) : 0;
}

function monthLabel(key){
  if(!key) return '日付不明';
  return Math.floor(key / 100) + '年' + (key % 100) + '月';
}

function monthCompare(a, b){
  if(a === 0) return 1;
  if(b === 0) return -1;
  return b - a;
}

function render(matches, team){
  const list = document.getElementById('list');
  const filtered = (team === ALL)
    ? matches
    : matches.filter(m => m.team === team || m.opponent === team);

  const groups = groupMatches(filtered);

  if(groups.length === 0){
    list.innerHTML = '<div class="state">まだ試合動画がありません。</div>';
    return;
  }

  const byMonth = new Map();
  groups.forEach(function(g){
    const k = monthKey(g.date);
    if(!byMonth.has(k)) byMonth.set(k, []);
    byMonth.get(k).push(g);
  });

  const keys = [...byMonth.keys()].sort(monthCompare);
  const openAll = (team !== ALL);

  list.innerHTML = keys.map(function(k, i){
    const items = byMonth.get(k).sort(function(a, b){
      return dateNum(b.date) - dateNum(a.date);
    });
    const isOpen = openAll || i < OPEN_MONTHS;
    return '<details class="month"' + (isOpen ? ' open' : '') + '>'
      + '<summary>'
      + '<span class="month-title">' + monthLabel(k) + '</span>'
      + '<span class="month-count">' + items.length + '試合</span>'
      + '</summary>'
      + '<div class="month-body">' + items.map(cardHtml).join('') + '</div>'
      + '</details>';
  }).join('');
}

function setupFilter(matches){
  const groups = groupMatches(matches);
  const counts = new Map();
  groups.forEach(function(g){
    [g.team, g.opponent].forEach(function(t){
      if(t) counts.set(t, (counts.get(t) || 0) + 1);
    });
  });
  const teams = [...counts.keys()].sort(function(a, b){
    return (counts.get(b) - counts.get(a)) || a.localeCompare(b, 'ja');
  });

  const sel = document.getElementById('teamSelect');
  sel.innerHTML = '';
  const all = document.createElement('option');
  all.value = ALL;
  all.textContent = 'すべてのチーム (' + groups.length + '試合)';
  sel.appendChild(all);
  teams.forEach(function(t){
    const o = document.createElement('option');
    o.value = t;
    o.textContent = t + ' (' + counts.get(t) + '試合)';
    sel.appendChild(o);
  });
  sel.disabled = false;
  sel.addEventListener('change', function(){
    render(matches, sel.value);
  });
}

fetch(CSV_URL)
  .then(res => { if(!res.ok) throw new Error('fetch failed'); return res.text(); })
  .then(text => {
    const matches = toMatches(parseCSV(text));
    setupFilter(matches);
    render(matches, ALL);
  })
  .catch(() => {
    document.getElementById('list').innerHTML =
      '<div class="state">動画リストの読み込みに失敗しました。時間をおいて開き直してみてください。</div>';
  });
</script>
  <footer class="site-footer">
    <h2>試合動画の撮影・公開について</h2>
    <p>掲載している試合動画は、両チームおよび審判の許可を得た上で撮影しています。</p>
    <p>フルサイズの試合動画については、FUN兵庫リーグ事務局に確認の上、関係者向けのYouTube限定公開として掲載しています。</p>
    <p>動画の収益化は行っていません。</p>
    <p>掲載動画についてお気づきの点がありましたら、各YouTube動画のコメント欄よりお知らせください。</p>
  </footer>
</body>
</html>
